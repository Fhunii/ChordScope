<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chord Scope v9</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="audition.css"></head>
<body><header><div><b>CHORD SCOPE</b><span>v9 · LOCAL AI</span></div><label class="button">曲を読み込む<input id="file" type="file" accept="audio/*" hidden></label></header><main>
<section id="drop"><strong>音源をドロップ</strong><small>完全無料 · 音源はMacの外へ送信されません</small></section>
<section id="studio" hidden><div class="toolbar"><button id="play">▶ 再生</button><button id="playSelection">選択範囲を再生</button><span id="time">0:00.00 / 0:00.00</span><label>VOL <input id="volume" type="range" min="0" max="1" step=".01" value=".8"></label><div class="meter"><i id="meter"></i></div></div>
<div class="filename"><b id="filename"></b><span>ハンドルを動かして解析範囲を選択</span></div><div id="waveWrap"><canvas id="wave"></canvas><div id="chordSelection"></div><div id="shadeL" class="shade"></div><div id="shadeR" class="shade"></div><div id="handleL" class="handle"></div><div id="handleR" class="handle"></div><div id="head"></div></div>
<div class="range"><b id="rangeText"></b><label>Key <select id="key"></select></label><label>BPM <input id="bpm" type="number" min="30" max="300" value="120"></label><label><input id="jazz" type="checkbox" checked> Jazz候補</label><label class="leadControl">リード抑制 <input id="lead" type="range" min="0" max="200" step="5" value="200"><output id="leadValue">200%</output></label><button id="previewLead">▶ リード除去後</button><button id="add">＋ 手動区間</button><button id="analyzeSelection" class="ai">◉ 1区間を解析</button><button id="analyzeTimeline" class="ai">◉ コード変化をまとめて解析</button></div>
<section class="midiPanel"><div><b>LEAD → MIDI</b><small>選択範囲のリード音をMIDI化</small></div><label>方式 <select id="midiMode"><option value="mono">単音リード</option><option value="poly">ポリフォニック</option></select></label><label>感度 <input id="midiSensitivity" type="range" min="10" max="90" value="45"><output id="midiSensitivityValue">45%</output></label><label>最低音 <input id="midiLow" type="number" min="0" max="127" value="48"></label><label>最高音 <input id="midiHigh" type="number" min="0" max="127" value="96"></label><label>最短音 <input id="midiMin" type="number" min="20" max="1000" step="10" value="90">ms</label><label>タイミング補正 <input id="midiQuantize" type="range" min="0" max="100" value="55"><output id="midiQuantizeValue">55%</output></label><label>短音結合 <input id="midiMerge" type="range" min="0" max="300" value="100"><output id="midiMergeValue">100ms</output></label><button id="exportMidi">⇩ リードMIDIを書き出す</button></section>
<div class="workspace"><section><div class="title"><b>コードレーン</b><small>横スクロール</small></div><div id="lane"></div><div id="empty">範囲を選んでローカルAI解析してください。</div></section><aside><div class="title"><b>LOCAL ANALYSIS</b><small id="status">待機中</small></div><div id="result" class="placeholder">解析結果はここに表示されます。</div></aside></div></section></main><audio id="audio"></audio><script src="app.js"></script></body></html>
